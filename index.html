<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>정보처리기사 실기 문제집</title>
    <link rel="stylesheet" href="styles.css?v=20261015-2" />
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>정보처리기사 실기 문제집</h1>
      </div>
    </header>

    <nav class="tabs" id="main-tabs" aria-label="메인 탭">
      <button type="button" class="tab-button active" data-tab="problems">기출문제</button>
      <button type="button" class="tab-button" data-tab="concepts">개념정리</button>
    </nav>

    <main class="layout">
      <aside class="sidebar">
        <div id="problem-pane">
          <div class="sidebar-header">문제 목록</div>
          <div id="status-filters" class="status-filters" aria-label="문제 상태 필터"></div>
          <nav id="file-list" aria-label="문제 목록"></nav>
        </div>
        <div id="concept-pane" hidden>
          <div class="sidebar-header">개념정리 (기출 기반)</div>
          <nav id="concept-list" aria-label="개념정리 목록"></nav>
        </div>
      </aside>

      <section class="viewer">
        <div id="current-round" class="current-round">문서 선택</div>
        <div id="content" class="content"></div>
      </section>
    </main>

    <script src="app.js?v=20261015-2"></script>
  </body>
</html>
